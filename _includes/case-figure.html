<figure class="case-figure">
  <a href="{{ include.src | relative_url }}" target="_blank" rel="noopener" aria-label="Open full-size image: {{ include.caption | escape }}">
    <img src="{{ include.src | relative_url }}" alt="{{ include.caption | escape }}" loading="lazy" decoding="async">
  </a>
  <figcaption>{{ include.caption }}</figcaption>
</figure>
