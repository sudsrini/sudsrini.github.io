---
layout: wrapper
---
<article class="case-study">
  <header class="case-header">
    <a class="case-back" href="{{ '/' | relative_url }}#experience-section">← All experience</a>
    <img class="case-cover" src="{{ page.main-image | relative_url }}" alt="{{ page.title | escape }} overview">
    <p class="case-eyebrow">{{ page.role }}</p>
    <h1>{{ page.title }}</h1>
    <p class="case-intro">{{ page.description }}</p>
    <ul class="case-skills" aria-label="Engineering skills">
      {% for skill in page.skills %}<li>{{ skill }}</li>{% endfor %}
    </ul>
  </header>
  <div class="case-body">{{ content }}</div>
  <footer class="case-end"><a href="{{ '/' | relative_url }}#experience-section">Explore more experience →</a></footer>
</article>
